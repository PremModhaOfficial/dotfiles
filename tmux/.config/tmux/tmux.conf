# ==========================================
# TERMINAL & SHELL CONFIGURATION
# ==========================================
set -g default-terminal "tmux-256color"
set -g default-shell /usr/bin/fish

# Enable RGB (TrueColor) and Undercurls (Curly underlines)
set -as terminal-features ",xterm-256color:RGB"
set -as terminal-features ",xterm-kitty:RGB"
set -as terminal-features ",alacritty:RGB"
set -as terminal-overrides ',*:Smulx=\E[4::%p1%dm'
set -as terminal-overrides ',*:Setulc=\E[58::2::%p1%{65536}%/%d::%p1%{256}%/%{255}%&%d::%p1%{255}%&%d%;m'

# Allow passing images (Useful for Yazi/Neovim)
set -g allow-passthrough on
set -ga update-environment TERM
set -ga update-environment TERM_PROGRAM
set -g update-environment "SSH_AUTH_SOCK"

# ==========================================
# GENERAL SETTINGS
# ==========================================
set -g mouse on
set -g focus-events on
set -g detach-on-destroy off  # Essential for tms switching
set -g escape-time 0          # Zero delay for vim keypresses
set -g history-limit 50000    # Boosted history
set -g display-time 4000      # Messages stay longer
set -g status-interval 5      # Update status bar every 5 seconds
set -g status-position top    # Top bar
set -g base-index 1           # Start indexing at 1
set -g pane-base-index 1
set -g renumber-windows on    # Re-index windows when one is closed
set -g set-clipboard on       # System clipboard integration
set -g extended-keys on
set -g extended-keys-format csi-u

# ==========================================
# KEYBINDINGS
# ==========================================
# Prefix key -> Ctrl + Space
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

# Refresh Config
bind r source-file ~/.config/tmux/tmux.conf \; display "Config reloaded!"

# Split windows (keeping current path)
bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# Window Navigation (Alt + H/L)
bind -n M-H previous-window
bind -n M-L next-window

# Session Navigation (Alt + [ / Alt + ])
bind -n M-[ switch-client -l  # Toggle between current and last session
bind -n M-] switch-client -n  # Next session (cycle through all)

# TMS BINDING (Legacy - Replaced by SessionX)
# bind-key -r o run-shell "tmux neww ~/.local/scripts/tms"

# Quick Actions
bind -r X kill-window
bind -r Q kill-pane

# Copy Mode (Vim Style)
set-window-option -g mode-keys vi
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel

# ==========================================
# 2026 TMUX UPGRADE: NEW KEYBINDINGS
# ==========================================
# Session Manager (sesh) - Prefix + o
bind-key o display-popup -E -w 80% -h 70% "sesh connect $(sesh list | fzf --prompt='Session: ')"

# Popup Menu - Prefix + m (Session actions)
bind-key m display-menu \
    -T "Session Menu" \
    -x C -y C \
    "New Session"      n "run-shell 'tmux new-session -d -s \"$(read -p \"Session name: \" name; echo $name)\"'" \
    "Kill Session"     k "confirm-before -p 'Kill session #{session_name}? (y/n)' kill-session" \
    "Rename Session"   r "command-prompt -I '#{session_name}' -p '(rename session):' 'rename-session -- \"%%\"'" \
    "" \
    "Reload Config"    R "source-file ~/.config/tmux/tmux.conf; display-message 'Config reloaded!'" \
    "Show Keybindings" \? "display-popup -E -w 80% -h 80% 'tmux list-keys | less'"

# Keybindings Reference - Prefix + ?
bind-key ? run-shell "tmux list-keys | less"

# ==========================================
# PLUGINS
# ==========================================
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'omerxx/tmux-floax'
set -g @plugin 'fcsonline/tmux-thumbs'

# ==========================================
# PLUGIN CONFIG
# ==========================================
# Floating Terminal (tmux-floax)
set -g @floax-bind 'p'
set -g @floax-width '80%'
set -g @floax-height '80%'
set -g @floax-border-color 'cyan'
set -g @floax-text-color 'blue'

# Keyboard Copy Hints (tmux-thumbs)
set -g @thumbs-key 't'
set -g @thumbs-contrast 1
set -g @thumbs-command 'echo -n {} | xclip -selection clipboard'

# ==========================================
# STATUS BAR (Minimalist & Fast)
# ==========================================
set -g status-style bg=default # Transparent background
set -g status-justify left

# Left side: Session name
set -g status-left-length 100
set -g status-left "#[fg=blue,bold]   #S #[fg=colour238] | "

# Center: Windows
# Inactive windows
set -g window-status-format "#[fg=colour245] #I:#W "
# Active window (Highlight)
set -g window-status-current-format "#[fg=green,bold] #I:#W* "

# Right side: Prefix indicator + Date/Time
set -g status-right-length 100
set -g status-right "#{?client_prefix,#[fg=red]PREFIX ,}#[fg=colour238] | #[fg=yellow]%H:%M "

# ==========================================
# MAXIMUM SESSION PERSISTENCE CONFIG
# ==========================================

## TMUX-RESURRECT: MAXIMUM SAVING

# Enable pane contents capture (scrollback + visible text)
set -g @resurrect-capture-pane-contents 'on'

# Save scrollback buffer
set -g @resurrect-save-scrollback 'on'

# VIM/NEOVIM: Restore sessions
set -g @resurrect-strategy-nvim 'session'
set -g @resurrect-strategy-vim 'session'

# RESTORE ALL PROGRAMS (⚠️ DANGEROUS - accepts all risks)
set -g @resurrect-processes ':all:'

## TMUX-CONTINUUM: AUTO-SAVE/RESTORE

# Enable auto-restore on tmux start
set -g @continuum-restore 'on'

# Auto-save interval in minutes (15 default, 2 for aggressive saving)
set -g @continuum-save-interval '2'

# Keep at bottom
run '~/.tmux/plugins/tpm/tpm'
