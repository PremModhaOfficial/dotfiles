# mpv.conf — gpu-next / Vulkan baseline for 1920x1080 panel
# YT 1080p 4:2:0 8-bit on NVIDIA RTX 3050 + Intel Alder Lake iGPU, niri Wayland.

# --- Output ---
# gpu-next is the only VO that can hand PQ + BT.2020 to the compositor cleanly,
# so it is the unconditional default now (the old conditional [hdr-passthrough]
# profile is obsolete — gpu-next is always in use).
vo=gpu-next
gpu-api=vulkan
vulkan-device=Intel(R) Graphics (ADL GT2)
target-colorspace-hint=yes

# --- Quality profile / scalers ---
# gpu-hq supplies the ewa_lanczos* options; gpu-next has no ewa_lanczossoft,
# so the cscale override below is deliberate and must come after the profile.
profile=gpu-hq
scale=ewa_lanczossharp
cscale=ewa_lanczos
dscale=mitchell

# --- Banding / dither ---
# deband is off: dither-depth=auto handles banding on 8-bit output without the
# deblock mush deband=yes introduced. hdeband.glsl (Ctrl+Y) is the manual path.
deband=no
dither-depth=auto

# --- Hardware decode ---
# auto-safe skips the decoders that break on this hybrid NVIDIA/Intel setup.
hwdec=auto-safe

# --- YouTube format selection ---
# Cap at 1080p: panel is 1920x1080, 1440p60 wastes decode + VRAM and OOMs Intel.
# Prefer AV1 up to 1080p, fall back to VP9 then best; keeps VP9 HDR.
ytdl-format=bv*[vcodec^=av01][height<=?1080]+bv*[height<=?1080]+ba/b

# --- Motion smooth to 60Hz panel ---
video-sync=display-resample
interpolation=yes
tscale=mitchell
