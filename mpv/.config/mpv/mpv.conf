# base quality (vo=gpu for gpu-hq profile's ewa_lanczos options)
vo=gpu
profile=gpu-hq
scale=ewa_lanczossharp
cscale=ewa_lanczossoft
deband=yes

# keep ytdl from picking trash formats
ytdl-format=bv*[height<=?1440][vcodec!=vp9.2]+ba/b

# HDR10 passthrough: when an HDR video is detected (sig-peak above SDR white),
# hop to vo=gpu-next -- the only output that can hand PQ + BT.2020 straight to
# the compositor. With the desktop in HDR mode (monitors_user.lua, cm=hdredid)
# target-colorspace-hint switches the whole output into PQ for the video and
# back after; with the output in SDR the same profile just gives HDR content to
# gpu-next's better tone mapping. Scalers overridden in-profile: gpu-next has
# no ewa_lanczossoft, and the global ewa_lanczossharp entry would error it.
[hdr-passthrough]
profile-cond=get("video-params/sig-peak", 0) > 1
vo=gpu-next
scale=spline36
cscale=spline36
target-colorspace-hint=yes
