# input.conf — shader chains
# stow path: /home/prm/.config/mpv/shaders/
# NOTE: mpv input.conf has no variable expansion — shader paths must be literal.

# Ctrl+Y = toggle deblock + CfL chroma denoise + NLMeans denoise/sharpen
Ctrl+y cycle-values glsl-shaders "/home/prm/.config/mpv/shaders/hdeband.glsl:/home/prm/.config/mpv/shaders/CfL_Prediction.glsl:/home/prm/.config/mpv/shaders/nlmeans_light_sharpen_denoise.glsl" "" ; show-text "Denoise chain toggled: ${glsl-shaders}"

# Ctrl+Shift+Y = same chain with the lite chroma pass (cheaper on 1080p realtime)
Ctrl+Shift+Y cycle-values glsl-shaders "/home/prm/.config/mpv/shaders/hdeband.glsl:/home/prm/.config/mpv/shaders/CfL_Prediction_Lite.glsl:/home/prm/.config/mpv/shaders/nlmeans_light_sharpen_denoise.glsl" "" ; show-text "Denoise chain (lite) toggled: ${glsl-shaders}"

# Ctrl+A = toggle Anime4K (anime) — clamp + medium soft restore
Ctrl+a cycle-values glsl-shaders "/home/prm/.config/mpv/shaders/Anime4K_Clamp_Highlights.glsl:/home/prm/.config/mpv/shaders/Anime4K_Restore_CNN_Soft_M.glsl" "" ; show-text "Anime4K toggled: ${glsl-shaders}"

# Ctrl+I = toggle IMAX 70mm Film Grade colors
Ctrl+i cycle-values glsl-shaders "/home/prm/.config/mpv/shaders/IMAX_Film_Grade.glsl" "" ; show-text "IMAX Film Grade toggled: ${glsl-shaders}"

# Ctrl+F = toggle FSRCNNX (live-action)
Ctrl+f cycle-values glsl-shaders "/home/prm/.config/mpv/shaders/FSRCNNX_x2_16-0-4-1.glsl" "" ; show-text "FSRCNNX toggled: ${glsl-shaders}"

# Ctrl+C = toggle CAS sharpening
Ctrl+c vf toggle cas=0.4 ; show-text "CAS Sharpening toggled"

# Ctrl+M = toggle display-resample interpolation (30p -> 60Hz smooth)
Ctrl+m cycle-values interpolation yes no ; show-text "Interp ${interpolation}"

# Ctrl+T = toggle true-frame interp via mvtools (needs mpv-git + plugin)
Ctrl+t vf toggle vapoursynth=file=~~home/vapoursynth/motioninterpolation.vpy:buffered-frames=4:concurrent-frames=4 ; show-text "True interp toggled"
