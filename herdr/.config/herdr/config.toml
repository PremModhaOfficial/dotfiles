# ── herdr config (tmux parity) ───────────────────────────────────
# Replicates a tricked-out tmux setup: Ctrl+Space prefix,
# Alt+Shift+H/L tab nav, Alt+[/] workspace nav, catppuccin, etc.
#
# Keybindings reference:
#
#   [[keys.command]]
#   type = "plugin_action" → invokes a plugin action script (action.sh)
#   type = "shell"         → runs inline shell command (no TTY issues)
#   type = "pane"          → opens a temporary pane (may have TTY issues)
#
#   prefix+o → sessionizer binary (tv picker, creates/focuses workspace)
#   prefix+f → herdr-plus projects (deprecated in favor of tv-based picker)
#   prefix+$ → token dashboard (live agent token spend / cost notifications)
#
# Connected files:
#   ~/.config/herdr/bin/sessionizer — Go binary, project picker + workspace manager
# ──────────────────────────────────────────────────────────────────

onboarding = false

[terminal]
default_shell = "/usr/bin/fish"

[keys]
prefix = "ctrl+space"
# Tab navigation: Alt+Shift+H/L to match tmux M-H (which = Alt+Shift+h on this keyboard)
previous_tab = "alt+shift+h"
next_tab = "alt+shift+l"
# Workspace navigation: Alt+[/]
previous_workspace = "alt+["
next_workspace = "alt+]"
# prefix+s: show workspace/session names (tmux muscle memory)
workspace_picker = ["prefix+w", "prefix+s"]
# hjkl: navigate workspace list / picker (prefix+s/w, sidebar)
navigate_workspace_up = "k"
navigate_workspace_down = "j"
# prefix+hjkl: move between panes (no conflict with workspace nav)
focus_pane_left = "prefix+h"
focus_pane_down = "prefix+j"
focus_pane_up = "prefix+k"
focus_pane_right = "prefix+l"

[[keys.command]]
key = "prefix+alt+t"
type = "plugin_action"
command = "jt.command-palette.open"
description = "Command palette"

[[keys.command]]
key = "prefix+f"
type = "plugin_action"
command = "cloudmanic.herdr-plus.projects"
description = "herdr-plus projects"

[[keys.command]]
key = "prefix+o"
type = "pane"
command = "/home/prm/.config/herdr/bin/sessionizer"
description = "Sessionizer: pick project, attach or create workspace"

[[keys.command]]
key = "prefix+$"
type = "plugin_action"
command = "dave.token-dashboard.open-dashboard"
description = "Token Dashboard: live agent token spend / cost notifications"

[[keys.command]]
key = "prefix+t"
type = "pane"
command = "/home/prm/.config/herdr/bin/herdr-theme"
description = "Switch fluoromachine theme (delta/retrowave/fluoromachine)"

[theme]
name = "catppuccin"
auto_switch = false

[theme.custom]
accent     = "#AF6DF9"  # purple
panel_bg   = "#262335"  # bg
surface0   = "#241B2F"  # bgdark
surface1   = "#463465"  # selection
surface_dim= "#262335"  # bg
overlay0   = "#495495"  # comment
overlay1   = "#495495"  # comment
text       = "#F8F8F8"  # fg
subtext0   = "#495495"  # comment
mauve      = "#FF7EDB"  # pink
green      = "#72F1B8"
yellow     = "#FFCC00"
red        = "#FE4450"
blue       = "#61E2FF"  # cyan
teal       = "#61E2FF"  # cyan
peach      = "#FF8B39"  # orange
[ui]
sidebar_width = 26
hide_tab_bar_when_single_tab = true
confirm_close = true
pane_borders = true
pane_gaps = true
show_agent_labels_on_pane_borders = true

agent_panel_sort = "spaces"
status_indicators = "symbols"
[ui.toast]
delivery = "system"
delay_seconds = 1

[ui.sound]
enabled = true

[experimental]
pane_history = true

# >>> furkankly.zoetrope keys (managed: `setup-keys` writes this block, `remove-keys` deletes it)
[[keys.command]]
key = "prefix+shift+z"
type = "plugin_action"
command = "furkankly.zoetrope.open"
description = "zoetrope: session graph (overlay)"

# The graph opens over the focused pane and gives the layout back when
# it closes. The same key closes it. Two other placements, if you would
# rather keep the graph on screen: uncomment one, or point the binding
# above at its action. Then: herdr server reload-config
